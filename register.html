<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crisis Bridge | Register Facility</title>
    <link rel="manifest" href="admin-manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 20% 50%, #1a0a0a 0%, #090a0f 60%, #0b0e14 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e0e0e0;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #e53935, #c62828);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px;
            box-shadow: 0 0 30px rgba(229, 57, 53, 0.4);
        }

        .brand h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .brand p {
            color: #e53935;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card-subtitle {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 1rem;
            opacity: 0.5;
        }

        .field input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .field input:focus {
            border-color: rgba(229, 57, 53, 0.6);
            box-shadow: 0 0 0 3px rgba(229, 57, 53, 0.12);
        }

        .field input::placeholder {
            color: #555;
        }

        /* Fix browser autofill white background */
        .field input:-webkit-autofill,
        .field input:-webkit-autofill:hover,
        .field input:-webkit-autofill:focus,
        .field input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px rgba(15, 10, 10, 0.95) inset !important;
            -webkit-text-fill-color: #e0e0e0 !important;
            border-color: rgba(255, 255, 255, 0.12) !important;
            caret-color: #e0e0e0;
        }

        .eye-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            line-height: 1;
            transition: color 0.2s;
        }

        .eye-btn:hover {
            color: #aaa;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e53935, #c62828);
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .register-btn:hover {
            opacity: 0.9;
        }

        .register-btn:active {
            transform: scale(0.99);
        }

        .register-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-msg {
            background: rgba(229, 57, 53, 0.1);
            border: 1px solid rgba(229, 57, 53, 0.3);
            color: #ff7875;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 14px;
            display: none;
        }

        .success-msg {
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid rgba(46, 204, 113, 0.3);
            color: #2ecc71;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 14px;
            display: none;
            text-align: center;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 24px 0;
        }

        .login-link {
            text-align: center;
            font-size: 0.85rem;
            color: #888;
        }

        .login-link a {
            color: #e53935;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .footer-tags {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
            font-size: 0.72rem;
            color: #555;
            letter-spacing: 1px;
        }

        .footer-tags span::before {
            content: '● ';
            color: #2ecc71;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="brand">
        <div class="brand-icon">🛡️</div>
        <h1>Crisis Bridge</h1>
        <p>Emergency Response System</p>
    </div>

    <div class="card">
        <div class="card-title">Institutional Access</div>
        <div class="card-subtitle">Register your facility to the command network.</div>

        <div class="field">
            <label>Hotel / Facility Name</label>
            <div class="input-wrap">
                <span class="input-icon">🏨</span>
                <input type="text" id="hotelName" placeholder="Grand Continental Hotel">
            </div>
        </div>

        <div class="field">
            <label>Admin Email</label>
            <div class="input-wrap">
                <span class="input-icon">✉️</span>
                <input type="email" id="adminEmail" placeholder="admin@facility.com">
            </div>
        </div>

        <div class="field">
            <label>Security Password</label>
            <div class="input-wrap">
                <span class="input-icon">🔒</span>
                <input type="password" id="adminPassword" placeholder="Min 6 characters">
                <button class="eye-btn" id="togglePass1">👁</button>
            </div>
        </div>

        <div class="field">
            <label>Confirm Password</label>
            <div class="input-wrap">
                <span class="input-icon">🔒</span>
                <input type="password" id="confirmPassword" placeholder="Repeat password">
                <button class="eye-btn" id="togglePass2">👁</button>
            </div>
        </div>

        <div class="field">
            <label>Security Desk Number</label>
            <div class="input-wrap">
                <span class="input-icon">📞</span>
                <input type="tel" id="securityPhone" placeholder="e.g. 01123456789">
            </div>
        </div>

        <div class="field">
            <label>Maintenance Number</label>
            <div class="input-wrap">
                <span class="input-icon">📞</span>
                <input type="tel" id="maintenancePhone" placeholder="e.g. 01198765432">
            </div>
        </div>

        <button class="register-btn" id="registerBtn">
            <span class="spinner" id="spinner"></span>
            REGISTER FACILITY
        </button>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <div class="divider"></div>

        <div class="login-link">
            Already registered? <a href="admin.html">Access Watchtower →</a>
        </div>
    </div>

    <div class="footer-tags">
        <span>SYSTEM ENCRYPTED</span>
        <span>IP LOGGED</span>
    </div>

    <script>
        const API_KEY = 'AIzaSyDfQ1o4y5muFoRlytzOUI9y-Cfz2Wb_GfU';
        const DB_URL = 'https://crux-crisis-app-default-rtdb.asia-southeast1.firebasedatabase.app';

        // Password toggles
        document.getElementById('togglePass1').addEventListener('click', () => {
            const inp = document.getElementById('adminPassword');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        });
        document.getElementById('togglePass2').addEventListener('click', () => {
            const inp = document.getElementById('confirmPassword');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        });

        document.getElementById('registerBtn').addEventListener('click', async () => {
            const hotelName = document.getElementById('hotelName').value.trim();
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const phone = document.getElementById('securityPhone').value.trim();

            const errorEl = document.getElementById('errorMsg');
            const successEl = document.getElementById('successMsg');
            const btn = document.getElementById('registerBtn');
            const spinner = document.getElementById('spinner');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            // Validation
            if (!hotelName || !email || !pass || !confirm) {
                errorEl.textContent = 'Please fill in all required fields.';
                errorEl.style.display = 'block';
                return;
            }
            if (pass.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters.';
                errorEl.style.display = 'block';
                return;
            }
            if (pass !== confirm) {
                errorEl.textContent = 'Passwords do not match.';
                errorEl.style.display = 'block';
                return;
            }

            // Loading state
            btn.disabled = true;
            spinner.style.display = 'inline-block';

            try {
                // 1. Create user via Firebase Auth REST API
                const authRes = await fetch(
                    `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password: pass, returnSecureToken: true })
                    }
                );
                const authData = await authRes.json();

                if (authData.error) {
                    let msg = authData.error.message;
                    if (msg === 'EMAIL_EXISTS') msg = 'This email is already registered. Try logging in.';
                    if (msg === 'INVALID_EMAIL') msg = 'Invalid email address.';
                    if (msg === 'WEAK_PASSWORD : Password should be at least 6 characters') msg = 'Password must be at least 6 characters.';
                    throw new Error(msg);
                }

                const uid = authData.localId;

                // 2. Save hotel profile via Realtime Database REST API
                await fetch(`${DB_URL}/hotels/${uid}/profile.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        hotelName: hotelName,
                        adminEmail: email,
                        registeredAt: new Date().toISOString()
                    })
                });

                // 3. Save default emergency contacts via Realtime Database REST API
                const maint = document.getElementById('maintenancePhone').value.trim();
                await fetch(`${DB_URL}/hotels/${uid}/emergency_contacts.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        security: phone || '01123456789',
                        medical: '108',
                        fire: '101',
                        maintenance: maint || '01198765432'
                    })
                });

                successEl.textContent = '✅ Facility registered! Redirecting to Watchtower...';
                successEl.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 2000);

            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        });
    </script>
</body>

</html>
